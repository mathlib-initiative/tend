[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tend"
version = "0.1.0"
description = "Typed Python toolkit for durable, long-running AI agent swarms."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["agents", "ai", "llm", "orchestration", "swarm", "typed"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.12",
    "pyyaml>=6.0",
]

[project.scripts]
tend = "tend.orchestrator.cli:main"
tend-agent = "tend.agent.cli:main"
tend-control = "tend.orchestrator.control_cli:main"
tend-task = "tend.orchestrator.task_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pyright>=1.1.390",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20260408",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tend"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
asyncio_mode = "auto"
markers = [
    "live: explicitly gated live provider compatibility tests",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
